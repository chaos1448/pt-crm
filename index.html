<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<title>PT 고객관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.json">
<!-- iOS 홈 화면 아이콘 / 전체화면 실행 -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT고객관리">
<style>
:root{
  --bg:#12161d; --bg-2:#161b24; --panel:#1a202a; --panel-2:#222834; --panel-3:#2b323f;
  --line:#2a313d; --line-2:#39424f;
  --ink:#e6eaf1; --ink-2:#9aa4b4; --ink-3:#6c7684; --ghost:#454e5c;
  --accent:#33d89e; --accent-ink:#05291d; --accent-soft:rgba(51,216,158,.14);
  --violet:#7f76e0; --violet-soft:rgba(127,118,224,.15);
  --good:#33d89e; --warn:#eeb055; --crit:#e86e7c;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(0,0,0,.22), 0 6px 18px -12px rgba(0,0,0,.45);
  --sh-lg:0 20px 50px -20px rgba(0,0,0,.55);
  --grad:linear-gradient(135deg,#33d89e,#4fc4ea);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f7f8fa; --bg-2:#f1f3f7; --panel:#fff; --panel-2:#f4f6f9; --panel-3:#eaeef4;
    --line:#e5e9ef; --line-2:#d3dae3;
    --ink:#1b222c; --ink-2:#616b7a; --ink-3:#8e97a5; --ghost:#bcc4cf;
    --accent:#17a97e; --accent-ink:#fff; --accent-soft:rgba(23,169,126,.12);
    --violet:#6157cf; --violet-soft:rgba(97,87,207,.12);
    --good:#17a97e; --warn:#d1912f; --crit:#d95264;
    --sh:0 1px 2px rgba(16,32,64,.06), 0 8px 24px -14px rgba(16,32,64,.22);
    --sh-lg:0 24px 60px -22px rgba(16,32,64,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.55 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 공통 ---------- */
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;
  transition:.15s border-color,.15s background,.15s transform
}
.btn:hover{border-color:var(--line-2);background:var(--panel-3)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:700}
.btn.p:hover{filter:brightness(1.08);background:var(--accent)}
.btn.g{background:var(--violet);border-color:transparent;color:#fff;font-weight:700}
.btn.g:hover{filter:brightness(1.1);background:var(--violet)}
.btn.w{background:var(--warn);border-color:transparent;color:#231603;font-weight:700}
.btn.d{background:transparent;border-color:rgba(255,95,112,.45);color:var(--crit)}
.btn.d:hover{background:rgba(255,95,112,.1);border-color:var(--crit)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{pointer-events:none}

.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600;letter-spacing:.01em}
.fld>input,.fld>select,.fld>textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;outline:none;transition:.15s border-color,.15s box-shadow
}
.fld>input:focus,.fld>select:focus,.fld>textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld>input::placeholder,.fld>textarea::placeholder{color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.fld{flex:1;min-width:130px}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px;box-shadow:var(--sh)
}
.muted{color:var(--ink-3)}
.tag{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);letter-spacing:.01em
}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.warn{background:rgba(255,182,72,.15);color:var(--warn);border-color:transparent}
.tag.crit{background:rgba(255,95,112,.15);color:var(--crit);border-color:transparent}
h2{font-size:14px;margin:0 0 13px;font-weight:700;letter-spacing:-.015em}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* 숫자 입력: 위아래 화살표 제거하고 직접 타이핑 */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:-5px 0 12px}
.presets button{padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;font-weight:700;color:var(--ink-2);transition:.15s}
.presets button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- 레이아웃 (좌측 사이드바) ---------- */
#app{display:flex;min-height:100vh}
#side{
  width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40
}
#side .logo{padding:19px 16px 16px}
#side .logo b{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;letter-spacing:-.03em}
#side .logo b::before{
  content:'';width:26px;height:26px;border-radius:8px;background:var(--grad);flex:0 0 26px;
  box-shadow:0 3px 10px -4px var(--accent)
}
#side .logo small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:7px;padding-left:34px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side nav{padding:4px 10px;flex:1}
#side nav button{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--ink-2);
  margin-bottom:1px;transition:.14s
}
#side nav button:hover{background:var(--panel-2);color:var(--ink)}
#side nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
#side nav button.on::before{
  content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)
}
#side nav button i{font-style:normal;width:18px;text-align:center;font-size:14px;filter:grayscale(.35)}
#side nav button.on i{filter:none}
#side nav button .badge{
  margin-left:auto;font-size:10.5px;font-weight:800;background:var(--crit);color:#fff;
  border-radius:20px;padding:1px 7px;
}
#side nav hr{margin:9px 8px}
#side .foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
#side .foot #sync{display:block;line-height:1.4;word-break:keep-all}
#side .foot button{width:100%;margin-top:8px}

#body{flex:1;min-width:0;display:flex;flex-direction:column}
#top{
  display:none;position:sticky;top:0;z-index:35;background:rgba(26,32,42,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 13px;padding-top:max(10px,env(safe-area-inset-top));
  align-items:center;gap:10px
}
@media (prefers-color-scheme:light){ #top{background:rgba(255,255,255,.88)} }
#top .mtitle{font-weight:800;font-size:15.5px;letter-spacing:-.02em}
#burger{font-size:19px;line-height:1;padding:3px 7px;border-radius:8px;color:var(--ink-2)}
#burger:hover{background:var(--panel-2)}
main{padding:22px;padding-bottom:max(28px,env(safe-area-inset-bottom));max-width:1180px;width:100%;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vtitle{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:-.035em}
.vsub{font-size:12.5px;color:var(--ink-3);margin:0 0 18px}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:38;backdrop-filter:blur(2px)}

@media(max-width:860px){
  #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg)}
  #side.open{transform:none}
  #top{display:flex}
  #scrim.on{display:block}
  main{padding:13px}
  .vtitle{font-size:19px}
}

/* ---------- 주간 캘린더 ---------- */
.calbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.calbar .wk{font-weight:800;font-size:16px;min-width:150px;letter-spacing:-.02em}
.grid{
  display:grid;grid-template-columns:56px repeat(var(--days),minmax(0,1fr));
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)
}
.gh{padding:10px 4px;text-align:center;font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line);background:var(--panel-2);color:var(--ink-3)}
.gh.today{color:var(--accent)}
.gh b{display:block;font-size:17px;color:var(--ink);font-weight:800;margin-top:1px}
.gh.today b{color:var(--accent)}
.gt{position:relative;border-right:1px solid var(--line);background:var(--panel-2)}
.gt i{position:absolute;right:7px;font-size:10.5px;color:var(--ink-3);font-style:normal;transform:translateY(-6px);font-variant-numeric:tabular-nums}
.col{position:relative;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.col .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.7}
.col .hr.half{border-top-style:dashed;opacity:.28}
.ev{
  position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 7px;overflow:hidden;
  font-size:11px;line-height:1.3;cursor:pointer;border-left:3px solid;color:#fff;
  box-shadow:0 2px 8px -3px rgba(0,0,0,.6);transition:.14s
}
.ev:hover{filter:brightness(1.12);z-index:6}
.ev b{display:block;font-size:12px;font-weight:700;letter-spacing:-.02em}
.ev.s예약{background:#5a53bd;border-color:#a9a2ff}
.ev.s완료{background:#1f8e68;border-color:#6fe0b6}
.ev.s노쇼{background:#9a4a5a;border-color:#f0a0ac}
.ev.snone{background:#434c5c;border-color:#8c95a5}
.slot{position:absolute;left:0;right:0;cursor:pointer;transition:.1s}
.slot:hover{background:var(--accent-soft)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--crit);z-index:5;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--crit)}

/* ---------- 월간 캘린더 ---------- */
.seg{display:inline-flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.seg button{padding:5px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-3);transition:.14s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mgrid .mh{padding:9px 4px;text-align:center;font-size:11.5px;font-weight:700;background:var(--panel-2);color:var(--ink-3);border-bottom:1px solid var(--line)}
.mcell{min-height:100px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;overflow:hidden;transition:.12s}
.mcell:nth-child(7n){border-right:0}
.mcell:hover{background:var(--accent-soft)}
.mcell.dim{opacity:.3}
.mcell .d{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mcell.today .d{color:var(--accent-ink);background:var(--accent);display:inline-block;min-width:20px;text-align:center;border-radius:6px;padding:0 4px}
.chip{display:block;font-size:10.5px;line-height:1.45;padding:1px 6px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-weight:600}
.chip.s예약{background:#5a53bd}
.chip.s완료{background:#1f8e68}
.chip.s노쇼{background:#9a4a5a}
.chip.snone{background:#434c5c}
.more{font-size:10px;color:var(--ink-3);padding-left:4px;font-weight:600}
@media(max-width:640px){ .mcell{min-height:74px;padding:3px} .chip{font-size:9.5px;padding:0 4px} .mcell .d{font-size:11px} }

/* ---------- 연간 ---------- */
.ygrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(214px,1fr))}
.ym{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 13px;box-shadow:var(--sh);transition:.15s}
.ym:hover{border-color:var(--line-2)}
.ym .hd{display:flex;align-items:baseline;gap:7px;cursor:pointer}
.ym .hd b{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.ym .hd small{font-size:10.5px;color:var(--ink-3);font-weight:600}
.ym .hd:hover b{color:var(--accent)}
.ym.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),var(--sh)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:9px}
.dg i{font-size:8.5px;font-style:normal;text-align:center;color:var(--ink-3);padding-bottom:2px;font-weight:600}
.dg u{font-size:10.5px;text-decoration:none;text-align:center;padding:3px 0;border-radius:5px;color:var(--ink-3);cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
.dg u.off{opacity:.15;cursor:default}
.dg u.has{color:#fff;font-weight:700}
.dg u.today{outline:1.5px solid var(--accent);outline-offset:-1px;color:var(--accent)}
.dg u.has.today{color:#fff}
.dg u:hover{background:var(--accent-soft)}
@media(max-width:640px){ .ygrid{grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px} .ym{padding:9px} }

/* ---------- 회원 ---------- */
.mlist{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.mrow{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  cursor:pointer;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);transition:.15s
}
.mrow:hover{border-color:var(--accent);transform:translateY(-1px)}
.mrow{align-items:flex-start}
.mrow .nm{font-weight:700;font-size:15.5px;letter-spacing:-.02em}
.mrow .ph{font-size:12.5px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.mrow .dts{display:grid;grid-template-columns:auto 1fr;gap:1px 9px;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.mrow .dts dt{font-size:11px;color:var(--ink-3);font-weight:600}
.mrow .dts dd{margin:0;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.big{font-size:21px;font-weight:800;text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);margin-top:1px}
.hist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-2)}
.hist div{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:9px;align-items:center}
.hist div:last-child{border-bottom:0}
.hist div:hover{background:var(--panel-2)}

.pkglist{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-2);overflow:hidden;margin-bottom:14px;max-height:260px;overflow-y:auto}
.pkgrow{padding:9px 11px;border-bottom:1px solid var(--line)}
.pkgrow:last-child{border-bottom:0}
.pkgrow .a{display:flex;align-items:center;gap:3px}
.pkgrow .a .sp{flex:1}
.pkgrow .a em{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-right:5px}
.pkgrow .b{font-size:11px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.pkgrow input.inl{width:44px;text-align:right;font-weight:700;font-size:13px}
.pkgrow input.inl.amt{width:96px}
input.inl{
  background:transparent;border:1px solid transparent;border-radius:7px;padding:3px 6px;outline:none;
  font-size:12.5px;transition:.14s;color:var(--ink)
}
input.inl:hover{border-color:var(--line-2);background:var(--panel-2)}
input.inl:focus{border-color:var(--accent);background:var(--panel-2);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- 모달 ---------- */
#mask{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#mask.on{display:flex;animation:fade .16s ease}
.modal{
  background:var(--panel);border:1px solid var(--line-2);border-radius:18px;width:100%;max-width:520px;
  max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--sh-lg);animation:pop .2s cubic-bezier(.3,1.3,.5,1)
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 16px;font-size:18px;font-weight:800;letter-spacing:-.03em}
.mhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}

/* ---------- 기타 ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:700;
  opacity:0;transition:.24s cubic-bezier(.3,1.2,.5,1);z-index:99;pointer-events:none;max-width:88vw;text-align:center;
  box-shadow:var(--sh-lg)
}
#toast.on{opacity:1;transform:translateX(-50%)}
#gate{max-width:470px;margin:9vh auto;padding:16px}
.step{display:flex;gap:12px;margin-bottom:14px;font-size:13.5px}
.step b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.unm{background:rgba(255,182,72,.09);border:1px solid rgba(255,182,72,.4);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:12px;font-size:13px}
.spacer{flex:1}
</style>
</head>
<body>

<div id="gate" style="display:none"></div>

<div id="app" style="display:none">
  <aside id="side">
    <div class="logo"><b>PT 고객관리</b><small id="who-mail"></small></div>
    <nav>
      <button data-v="cal"><i>📅</i>예약</button>
      <button data-v="mem"><i>👥</i>회원</button>
      <button data-v="rev"><i>💰</i>매출</button>
      <button data-v="re"><i>🔄</i>재등록 대상<span class="badge" id="re-badge" style="display:none">0</span></button>
      <hr>
      <button data-v="body"><i>📏</i>체형관리</button>
      <button data-v="work"><i>🏋️</i>운동이력</button>
      <button data-v="note"><i>📝</i>특이사항</button>
      <hr>
      <button data-v="set"><i>⚙️</i>설정</button>
    </nav>

const PRESET = {
  sb_url : 'https://fropdvyqchmmtcbtzprk.supabase.co',
  sb_key : 'sb_publishable_SkjkDVlzjDOYtG9MOUKaSw_qjQ13Hvp',

  cal    : ''    // 비워두면 기본 캘린더. 전용 캘린더 쓰면 그 캘린더 ID

const DEF = { sb_url:'', sb_key:'', gcid:'', cal:'primary', dur:50, noshow:false, automatch:true, h0:6, h1:23 };

const S = {

};
let sb = null;

/* ============================================================
   유틸
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (+n||0).toLocaleString('ko-KR');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm  = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const md  = d => `${d.getMonth()+1}/${d.getDate()}`;
const DOW = ['일','월','화','수','목','금','토'];
const todayStr = () => ymd(new Date());

function monday(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mkDate(dateStr, timeStr){
  const [Y,M,D] = dateStr.split('-').map(Number);
  const [h,m]   = timeStr.split(':').map(Number);
  return new Date(Y, M-1, D, h, m, 0, 0);
}
function daysLeft(dateStr){
  if(!dateStr) return null;
  const a = mkDate(dateStr,'00:00'), b = mkDate(todayStr(),'00:00');
  return Math.round((a-b)/864e5);
}
let toastT;
function toast(msg, ms=2400){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), ms);
}
function confirmDo(msg){ return window.confirm(msg); }

/* ============================================================
   Supabase
   ============================================================ */
function initSB(){
  const c = cfg();
  if(!c.sb_url || !c.sb_key) return false;
  sb = window.supabase.createClient(c.sb_url, c.sb_key, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  return true;
}
const T = n => sb.from(n);

async function loadAll(){
  const [m,p,b,bd,w] = await Promise.all([
    T('crm_members').select('*').order('name'),
    T('crm_packages').select('*').order('id'),
    T('crm_bookings').select('*').order('start_at'),

  ]);

  S.body     = bd.error ? [] : (bd.data || []);
  S.workouts = w.error  ? [] : (w.data  || []);
  S.v2 = !(bd.error || w.error);
}

/* ============================================================
   회원 집계
   ============================================================ */
const memPkgs = id => S.packages.filter(p => p.member_id === id);
const memBks  = id => S.bookings.filter(b => b.member_id === id);

function usedCount(id){
  const c = cfg();
  return memBks(id).filter(b => b.status === '완료' || (c.noshow && b.status === '노쇼')).length;
}
function totalCount(id){ return memPkgs(id).reduce((s,p)=> s + (+p.total||0), 0); }
function remain(id){ return totalCount(id) - usedCount(id); }
function startOf(id){
  const ds = memPkgs(id).map(p => p.start_date).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1] : null;
}
function firstJoin(id){
  const m = S.members.find(x => x.id === id);
  const ds = memPkgs(id).map(p => p.start_date).filter(Boolean).sort();
  return ds.length ? ds[0] : (m && m.created_at ? String(m.created_at).slice(0,10) : null);
}
function expireOf(id){
  const ds = memPkgs(id).map(p=>p.expire_date).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1] : null;
}
function memberState(id){
  const r = remain(id), dl = daysLeft(expireOf(id));
  if(r <= 0)                    return {k:'crit', t:'잔여 소진'};
  if(dl !== null && dl < 0)     return {k:'crit', t:'기간 만료'};
  if(r <= 3)                    return {k:'warn', t:`잔여 ${r}회`};
  if(dl !== null && dl <= 14)   return {k:'warn', t:`만료 D-${dl}`};
  return {k:'ok', t:`잔여 ${r}회`};
}
const memName = id => (S.members.find(m=>m.id===id)?.name) || '(삭제된 회원)';

/* ============================================================
   구글 캘린더
   ============================================================ */
const GSCOPE = 'https://www.googleapis.com/auth/calendar';
let GTOK = { t:null, exp:0 }, tokenClient = null;

function gReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }

function requestToken(prompt){
  return new Promise((res, rej) => {
    if(!gReady())      return rej(new Error('구글 스크립트 로드 실패'));
    if(!cfg().gcid)    return rej(new Error('구글 클라이언트 ID 미설정'));
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg().gcid,
      scope: GSCOPE,
      callback: r => {
        if(r && r.access_token){
          GTOK = { t:r.access_token, exp: Date.now() + ((+r.expires_in||3600)-90)*1000 };
          res(GTOK.t);
        } else rej(new Error(r && r.error ? r.error : '토큰 발급 실패'));
      },
      error_callback: e => rej(new Error((e && (e.type||e.message)) || '구글 인증 취소'))
    });
    tokenClient.requestAccessToken({ prompt });
  });
}
async function gtoken(interactive){
  if(GTOK.t && GTOK.exp > Date.now()) return GTOK.t;
  try { return await requestToken(''); }
  catch(e){
    if(!interactive) throw e;
    return await requestToken('consent');
  }
}
async function gapi(path, opt={}, interactive=false){
  const tok  = await gtoken(interactive);
  const url  = 'https://www.googleapis.com/calendar/v3' + path;
  const init = Object.assign({}, opt, {
    headers: Object.assign({ Authorization:'Bearer '+tok, 'Content-Type':'application/json' }, opt.headers||{})
  });
  let res = await fetch(url, init);
  if(res.status === 401){                      // 토큰 만료 → 1회 재시도
    GTOK = { t:null, exp:0 };
    const t2 = await gtoken(interactive);
    init.headers.Authorization = 'Bearer ' + t2;
    res = await fetch(url, init);
  }
  if(res.status === 204) return null;
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error?.message || ('구글 API '+res.status));
  return j;
}
const calPath = () => '/calendars/' + encodeURIComponent(cfg().cal || 'primary') + '/events';

async function gList(from, to){
  const q = new URLSearchParams({
    timeMin: from.toISOString(), timeMax: to.toISOString(),
    singleEvents:'true', orderBy:'startTime', maxResults:'250'
  });
  let items = [], pageToken = '';
  do{
    if(pageToken) q.set('pageToken', pageToken); else q.delete('pageToken');
    const j = await gapi(calPath() + '?' + q.toString());
    items = items.concat(j.items || []);
    pageToken = j.nextPageToken || '';
  } while(pageToken);
  return items.filter(e => e.start && e.start.dateTime);   // 종일 일정 제외
}
function evBody(bk){
  const nm = memName(bk.member_id);
  return {
    summary: `${nm} PT` + (bk.status === '노쇼' ? ' (노쇼)' : ''),
    description: bk.memo || '',
    start: { dateTime: new Date(bk.start_at).toISOString() },
    end:   { dateTime: new Date(bk.end_at).toISOString() },
    extendedProperties: { private: { ptcrm_booking: String(bk.id), ptcrm_member: String(bk.member_id) } }
  };
}
async function gPush(bk){
  if(!cfg().gcid) return null;
  try{
    if(bk.gcal_id){
      await gapi(calPath() + '/' + encodeURIComponent(bk.gcal_id), { method:'PATCH', body: JSON.stringify(evBody(bk)) });
      return bk.gcal_id;
    }
    const ev = await gapi(calPath(), { method:'POST', body: JSON.stringify(evBody(bk)) });
    await T('crm_bookings').update({ gcal_id: ev.id }).eq('id', bk.id);
    bk.gcal_id = ev.id;
    return ev.id;
  }catch(e){ console.warn('gPush', e); toast('구글 캘린더 반영 실패: ' + e.message, 3200); return null; }
}
async function gDelete(gid){
  if(!gid || !cfg().gcid) return;
  try{ await gapi(calPath() + '/' + encodeURIComponent(gid), { method:'DELETE' }); }
  catch(e){ if(!/404|410|Not Found|deleted/i.test(e.message)) console.warn('gDelete', e); }
}

/* ============================================================
   양방향 동기화 — 화면에 보이는 기간만 대조
   ============================================================ */
function findMemberBySummary(sum){
  if(!sum) return null;
  const hits = S.members.filter(m => m.name && sum.includes(m.name));
  if(hits.length !== 1) return null;                  // 0건 또는 애매하면 수동 연결
  return hits[0];
}

function gErrMsg(e){
  const m = String((e && e.message) || e);
  if(/popup|interaction_required|access_denied/i.test(m))  return '⚠ 구글 권한 만료 — 설정에서 로그아웃 후 재로그인';
  if(/insufficient authentication scopes/i.test(m))        return '⚠ 캘린더 권한 없음 — 로그아웃 후 재로그인';
  if(/has not been used in project|accessNotConfigured/i.test(m)) return '⚠ Calendar API가 꺼져 있습니다';
  if(/Not Found|404/i.test(m))                             return '⚠ 캘린더를 찾을 수 없음 — 설정에서 다시 선택';
  return '⚠ ' + m;
}

async function syncWindow(interactive){
  const c = cfg();
  if(!c.gcid){ S.gsync = '구글 미연동'; return; }
  if(S.mode === 'year'){ S.gsync = '연간 보기 · 구글 동기화 생략'; S.unmatched = []; return; }
  if(S.syncing) return;
  S.syncing = true; S.gsync = '동기화 중…'; paintSync();

  const [from, to] = rangeOf();
  let items;
  try{
    await gtoken(interactive);
    items = await gList(from, to);
  }catch(e){
    S.syncing = false; S.gsync = gErrMsg(e); paintSync();
    if(interactive) toast(gErrMsg(e).replace(/^⚠ /,''), 4200);
    return;
  }

  const seenGid = new Set();
  let linked = 0, pulled = 0, pushed = 0, removed = 0;
  S.unmatched = [];

  /* --- 구글 → 앱 --- */
  for(const ev of items){
    seenGid.add(ev.id);
    const bid = ev.extendedProperties && ev.extendedProperties.private && ev.extendedProperties.private.ptcrm_booking;
    const s = new Date(ev.start.dateTime), e = new Date(ev.end.dateTime);

    if(bid){
      const bk = S.bookings.find(x => String(x.id) === String(bid));
      if(!bk){                                        // 앱에서 지운 예약 → 구글에서도 제거
        await gDelete(ev.id); removed++; continue;
      }
      if(!bk.gcal_id){ await T('crm_bookings').update({gcal_id:ev.id}).eq('id',bk.id); bk.gcal_id = ev.id; }
      if(+new Date(bk.start_at) !== +s || +new Date(bk.end_at) !== +e){   // 구글에서 시간 변경
        await T('crm_bookings').update({ start_at:s.toISOString(), end_at:e.toISOString() }).eq('id', bk.id);
        bk.start_at = s.toISOString(); bk.end_at = e.toISOString(); pulled++;
      }
      continue;
    }

    const m = cfg().automatch ? findMemberBySummary(ev.summary) : null;
    if(m){                                            // 캘린더에서 만든 일정 → 예약으로 흡수
      const { data, error } = await T('crm_bookings').insert({
        member_id:m.id, start_at:s.toISOString(), end_at:e.toISOString(),
        status:'예약', gcal_id:ev.id, memo:'구글 캘린더에서 생성'
      }).select().single();
      if(!error && data){
        S.bookings.push(data); linked++;
        await gapi(calPath()+'/'+encodeURIComponent(ev.id), {
          method:'PATCH',
          body: JSON.stringify({ extendedProperties:{ private:{ ptcrm_booking:String(data.id), ptcrm_member:String(m.id) } } })
        }).catch(()=>{});
      }
    } else {
      S.unmatched.push({ id:ev.id, summary: ev.summary || '(제목 없음)', s, e });
    }
  }

  /* --- 앱 → 구글 --- */
  const inWin = S.bookings.filter(b => { const t = +new Date(b.start_at); return t >= +from && t < +to; });
  for(const bk of inWin){
    if(!bk.gcal_id){ if(await gPush(bk)) pushed++; }
    else if(!seenGid.has(bk.gcal_id)){               // 구글에서 삭제됨 → 앱에서도 삭제
      await T('crm_bookings').delete().eq('id', bk.id);
      S.bookings = S.bookings.filter(x => x.id !== bk.id);
      removed++;
    }
  }

  const bits = [];
  if(linked)  bits.push(`캘린더→앱 ${linked}건 등록`);
  if(pulled)  bits.push(`시간변경 ${pulled}건`);
  if(pushed)  bits.push(`앱→캘린더 ${pushed}건`);
  if(removed) bits.push(`삭제 ${removed}건`);
  S.syncing = false;
  S.gsync = '✓ ' + hm(new Date()) + (bits.length ? ' · ' + bits.join(' · ') : '');
  if(bits.length) toast(bits.join(' · '));
  render();
}

/* ============================================================
   렌더 — 예약(주간)
   ============================================================ */
function paintSync(){ const el = $('#sync'); if(el) el.textContent = S.gsync || '—'; }

function rangeOf(){
  const a = S.anchor;
  if(S.mode === 'year')  return [new Date(a.getFullYear(), 0, 1), new Date(a.getFullYear()+1, 0, 1)];
  if(S.mode === 'month') return [new Date(a.getFullYear(), a.getMonth(), 1), new Date(a.getFullYear(), a.getMonth()+1, 1)];
  return [a, addDays(a, S.mode === 'week' ? 7 : 1)];
}
function anchorFor(mode, base){
  const n = base || new Date();
  if(mode === 'year')  return new Date(n.getFullYear(), 0, 1);
  if(mode === 'month') return new Date(n.getFullYear(), n.getMonth(), 1);
  if(mode === 'week')  return monday(n);
  return mkDate(ymd(n), '00:00');
}
function setMode(m, base){ S.mode = m; S.anchor = anchorFor(m, base); render(); syncWindow(false); }
function shiftBy(dir){
  const a = S.anchor;
  S.anchor = S.mode === 'year'  ? new Date(a.getFullYear()+dir, 0, 1)
           : S.mode === 'month' ? new Date(a.getFullYear(), a.getMonth()+dir, 1)
           : addDays(a, dir * (S.mode === 'week' ? 7 : 1));
  render(); syncWindow(false);
}

function calLabel(){
  const a = S.anchor;
  if(S.mode === 'year')  return `${a.getFullYear()}년`;
  if(S.mode === 'month') return `${a.getFullYear()}년 ${a.getMonth()+1}월`;
  if(S.mode === 'day')   return `${a.getFullYear()}. ${md(a)} (${DOW[a.getDay()]})`;
  return `${a.getFullYear()}. ${md(a)} – ${md(addDays(a,6))}`;
}

function renderCal(){
  let h = `<div class="calbar">
    <button class="btn sm" id="c-prev">◀</button>
    <button class="btn sm" id="c-today">오늘</button>
    <button class="btn sm" id="c-next">▶</button>
    <span class="wk">${calLabel()}</span>
    <span class="spacer" style="flex:1"></span>
    <span class="seg">
      <button data-m="day"   class="${S.mode==='day'?'on':''}">일</button>
      <button data-m="week"  class="${S.mode==='week'?'on':''}">주</button>
      <button data-m="month" class="${S.mode==='month'?'on':''}">월</button>
      <button data-m="year"  class="${S.mode==='year'?'on':''}">년</button>
    </span>
    <button class="btn p sm" id="c-add">+ 예약</button>
  </div>`;

  if(S.unmatched.length){
    h += `<div class="unm"><b>🔗 구글 캘린더에만 있는 일정 ${S.unmatched.length}건</b> — 회원과 연결하면 출결로 잡힙니다.<div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap">`
      + S.unmatched.map(u => `<button class="btn sm" data-link="${esc(u.id)}">${md(u.s)} ${hm(u.s)} · ${esc(u.summary)}</button>`).join('')
      + `</div></div>`;
  }

  h += S.mode === 'year' ? yearHTML() : S.mode === 'month' ? monthHTML() : gridHTML();
  $('#v-cal').innerHTML = h;

  $('#c-prev').onclick  = () => shiftBy(-1);
  $('#c-next').onclick  = () => shiftBy(1);
  $('#c-today').onclick = () => setMode(S.mode);
  $('#c-add').onclick   = () => bookingModal(null, todayStr(), '10:00');
  $$('#v-cal .seg button').forEach(b => b.onclick = () => setMode(b.dataset.m, S.anchor));
  $$('#v-cal .slot').forEach(el => el.onclick = ev => {
    ev.stopPropagation(); bookingModal(null, el.closest('.col').dataset.day, el.dataset.t);
  });
  $$('#v-cal [data-bk]').forEach(el => el.onclick = ev => { ev.stopPropagation(); bookingModal(+el.dataset.bk); });
  $$('#v-cal [data-link]').forEach(el => el.onclick = ev => { ev.stopPropagation(); linkModal(el.dataset.link); });
  $$('#v-cal .mcell').forEach(el => el.onclick = () => setMode('day', mkDate(el.dataset.day,'00:00')));
  $$('#v-cal .ym .hd').forEach(el => el.onclick = () => setMode('month', new Date(+el.dataset.mo)));
  $$('#v-cal .dg u[data-day]').forEach(el => el.onclick = () => setMode('day', mkDate(el.dataset.day,'00:00')));
}

/* --- 연간 --- */
function yearHTML(){
  const Y = S.anchor.getFullYear();
  const cnt = {};                                   // 'YYYY-MM-DD' -> 예약 건수
  for(const b of S.bookings){
    const d = new Date(b.start_at);
    if(d.getFullYear() === Y) cnt[ymd(d)] = (cnt[ymd(d)] || 0) + 1;
  }
  const nowY = new Date().getFullYear(), nowM = new Date().getMonth();

  let h = `<div class="ygrid">`;
  for(let mo = 0; mo < 12; mo++){
    const first = new Date(Y, mo, 1), last = new Date(Y, mo+1, 0);
    const lead  = (first.getDay() + 6) % 7;         // 월요일 시작
    let total = 0, done = 0;
    for(const b of S.bookings){
      const d = new Date(b.start_at);
      if(d.getFullYear() === Y && d.getMonth() === mo){ total++; if(b.status === '완료') done++; }
    }
    h += `<div class="ym${Y===nowY && mo===nowM ? ' cur' : ''}">
      <div class="hd" data-mo="${+first}"><b>${mo+1}월</b><small>${total ? `${total}건 · 완료 ${done}` : '—'}</small></div>
      <div class="dg">${DOW.slice(1).concat(DOW[0]).map(d => `<i>${d}</i>`).join('')}`;
    for(let i = 0; i < lead; i++) h += `<u class="off"></u>`;
    for(let d = 1; d <= last.getDate(); d++){
      const key = `${Y}-${pad(mo+1)}-${pad(d)}`, n = cnt[key] || 0;
      const bg = n ? ` style="background:color-mix(in srgb, var(--accent) ${n>=3?100:n===2?70:45}%, transparent)"` : '';
      h += `<u class="${n?'has':''}${key===todayStr()?' today':''}" data-day="${key}"${bg} title="${n?n+'건':''}">${d}</u>`;
    }
    h += `</div></div>`;
  }
  return h + `</div>`;
}

/* --- 월간 --- */
function monthHTML(){
  const a = S.anchor, mo = a.getMonth();
  const first = monday(new Date(a.getFullYear(), mo, 1));
  const weeks = Math.ceil(((new Date(a.getFullYear(), mo+1, 0).getDate()) + ((new Date(a.getFullYear(), mo, 1).getDay()+6)%7)) / 7);

  let h = `<div class="mgrid">` + DOW.slice(1).concat(DOW[0]).map(d => `<div class="mh">${d}</div>`).join('');
  for(let i = 0; i < weeks*7; i++){
    const d = addDays(first, i), key = ymd(d);
    const dim = d.getMonth() !== mo, today = key === todayStr();
    const items = S.bookings.filter(b => ymd(new Date(b.start_at)) === key)
      .map(b => ({t:new Date(b.start_at), cls:'s'+b.status, txt:`${hm(new Date(b.start_at))} ${memName(b.member_id)}`, attr:`data-bk="${b.id}"`}))
      .concat(S.unmatched.filter(u => ymd(u.s) === key)
        .map(u => ({t:u.s, cls:'snone', txt:`${hm(u.s)} ${u.summary}`, attr:`data-link="${esc(u.id)}"`})))
      .sort((x,y) => x.t - y.t);
    const show = items.slice(0, 3);
    h += `<div class="mcell${dim?' dim':''}${today?' today':''}" data-day="${key}">
      <div class="d">${d.getDate()}</div>
      ${show.map(i => `<span class="chip ${i.cls}" ${i.attr}>${esc(i.txt)}</span>`).join('')}
      ${items.length > 3 ? `<div class="more">+${items.length-3}건</div>` : ''}
    </div>`;
  }
  return h + `</div>`;
}

/* --- 일간 / 주간 --- */
function gridHTML(){
  const c = cfg(), H0 = +c.h0, H1 = +c.h1, PXH = 52, H = (H1 - H0) * PXH;
  const days = S.mode === 'week' ? 7 : 1, a = S.anchor;

  let h = `<div class="grid" style="--days:${days}"><div class="gh"></div>`;
  for(let i=0;i<days;i++){
    const d = addDays(a,i), t = ymd(d) === todayStr();
    h += `<div class="gh${t?' today':''}">${DOW[d.getDay()]}<b>${d.getDate()}</b></div>`;
  }
  h += `<div class="gt" style="height:${H}px">`;
  for(let hh=H0; hh<H1; hh++) h += `<i style="top:${(hh-H0)*PXH}px">${pad(hh)}</i>`;
  h += `</div>`;

  for(let i=0;i<days;i++){
    const d = addDays(a,i), key = ymd(d);
    h += `<div class="col" data-day="${key}" style="height:${H}px">`;
    for(let hh=H0; hh<H1; hh++){
      const y = (hh-H0)*PXH;
      h += `<div class="hr" style="top:${y}px"></div><div class="hr half" style="top:${y+PXH/2}px"></div>`;
      h += `<div class="slot" data-t="${pad(hh)}:00" style="top:${y}px;height:${PXH/2}px"></div>`;
      h += `<div class="slot" data-t="${pad(hh)}:30" style="top:${y+PXH/2}px;height:${PXH/2}px"></div>`;
    }
    if(key === todayStr()){
      const n = new Date(), off = (n.getHours()+n.getMinutes()/60 - H0)*PXH;
      if(off >= 0 && off <= H) h += `<div class="nowline" style="top:${off}px"></div>`;
    }
    for(const b of S.bookings.filter(b => ymd(new Date(b.start_at)) === key).sort((x,y)=> +new Date(x.start_at) - +new Date(y.start_at))){
      const s = new Date(b.start_at), e = new Date(b.end_at);
      const top = (s.getHours()+s.getMinutes()/60 - H0)*PXH;
      const hgt = Math.max(22, ((e-s)/36e5)*PXH - 2);
      if(top < -30 || top > H) continue;
      h += `<div class="ev s${b.status}" data-bk="${b.id}" style="top:${top}px;height:${hgt}px">
              <b>${esc(memName(b.member_id))}</b>${hm(s)}–${hm(e)}${b.status!=='예약'?' · '+b.status:''}</div>`;
    }
    for(const u of S.unmatched.filter(u => ymd(u.s) === key)){
      const top = (u.s.getHours()+u.s.getMinutes()/60 - H0)*PXH;
      const hgt = Math.max(22, ((u.e-u.s)/36e5)*PXH - 2);
      if(top < -30 || top > H) continue;
      h += `<div class="ev snone" data-link="${esc(u.id)}" style="top:${top}px;height:${hgt}px">
              <b>${esc(u.summary)}</b>미연결</div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

const payDate = p => p.start_date || String(p.created_at || '').slice(0,10);
const decOf = (id) => { const v = parseFloat(String(($('#'+id)||{}).value||'').replace(/[^0-9.]/g,'')); return Number.isFinite(v) ? v : null; };

function sumRange(y, mo){                       // mo 생략 시 연간
  let amt = 0, cnt = 0, sess = 0;
  for(const p of S.packages){
    const d = payDate(p); if(!d) continue;
    if(+d.slice(0,4) !== y) continue;
    if(mo != null && +d.slice(5,7) !== mo+1) continue;
    amt += (+p.price||0); cnt++; sess += (+p.total||0);
  }
  return { amt, cnt, sess };
}
function arrow(cur, prev){
  if(!prev) return cur ? `<span style="color:var(--good);font-size:12px;font-weight:700">신규</span>`
                       : `<span class="muted" style="font-size:12px">—</span>`;
  const r = (cur - prev) / prev * 100;
  const c = r > 0 ? 'var(--good)' : r < 0 ? 'var(--crit)' : 'var(--ink-3)';
  const a = r > 0 ? '▲' : r < 0 ? '▼' : '—';
  return `<span style="color:${c};font-size:12px;font-weight:700">${a} ${Math.abs(r).toFixed(1)}%</span>`;
}
function kpi(label, value, unit, sub){
  return `<div class="card" style="flex:1;min-width:152px;padding:14px 16px;position:relative;overflow:hidden">
    <span style="position:absolute;left:0;top:0;width:100%;height:2px;background:var(--grad);opacity:.75"></span>
    <div class="muted" style="font-size:11.5px;font-weight:600">${label}</div>
    <div style="font-size:24px;font-weight:800;line-height:1.15;margin:3px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${value}<span style="font-size:13px;color:var(--ink-3);font-weight:600">${unit||''}</span></div>
    <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub||''}</div></div>`;
}

    ${kpi('결제 건수', yCur.cnt, '건', `<span class="muted" style="font-size:12px">등록 회차 ${yCur.sess}회</span>`)}
    ${kpi('평균 단가', won(avg), '원', `<span class="muted" style="font-size:12px">건당</span>`)}

                   title="${i+1}월 ${won(m.amt)}원 (${m.cnt}건)">

        <div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
            <b>${esc(k)}</b><span>${won(v)}원 <span class="muted">(${(v/mTot*100).toFixed(0)}%)</span></span></div>
          <div style="height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden">
            <div style="width:${v/mTot*100}%;height:100%;background:var(--grad)"></div></div>

    </div>

    <div class="card" style="flex:1;min-width:270px">
      <h2>📋 월별 상세</h2>
      <div class="hist" style="max-height:290px">
        ${months.map((m,i) => {
          const pv = i > 0 ? months[i-1].amt : sumRange(Y-1,11).amt;
          return `<div><span style="width:34px">${i+1}월</span>
            <span class="muted" style="width:42px">${m.cnt}건</span>
            <span style="flex:1"></span>

            ${arrow(m.amt, pv)}</div>`;

  $('#rv-add').onclick  = () => pickMember('결제(회차) 등록할 회원', id => packageModal(id, false));
  $('#rv-prev').onclick = () => { S.revY--; renderRev(); };
  $('#rv-next').onclick = () => { if(S.revY < now.getFullYear()){ S.revY++; renderRev(); } };
}

/* ============================================================
   재등록 대상
   ============================================================ */
function reTargets(){
  const out = [];
  for(const m of S.members){
    if(m.active === false) continue;
    if(totalCount(m.id) === 0) continue;                 // 아직 등록 이력 없는 회원 제외
    const r = remain(m.id), ex = expireOf(m.id), dl = daysLeft(ex);
    let tag = null, u = 0, k = 'warn';
    if(r <= 0)                        { tag = '잔여 소진';       u = 200;          k = 'crit'; }
    else if(dl !== null && dl < 0)    { tag = '기간 만료';       u = 190;          k = 'crit'; }
    else if(r <= 3)                   { tag = `잔여 ${r}회`;     u = 150 - r*10;   k = 'warn'; }
    else if(dl !== null && dl <= 30)  { tag = `만료 D-${dl}`;    u = 100 - dl;     k = 'warn'; }
    if(tag) out.push({ m, tag, u, k, r, ex, dl });
  }
  return out.sort((a,b) => b.u - a.u);
}
function lastSession(id){

function v2Warn(){
  return S.v2 === false
    ? `<div class="unm" style="border-color:var(--crit);background:rgba(239,91,91,.1)">
         ⚠️ 이 기능을 쓰려면 <b>schema-v2.sql</b> 을 Supabase SQL Editor에서 한 번 실행해야 합니다.
         (체형·운동이력 테이블이 아직 없습니다)</div>`
    : '';
}
function pickerHTML(id, sel){
  if(!S.members.length) return `<div class="card muted" style="text-align:center;padding:34px">먼저 <b>👥 회원</b>에서 회원을 등록하세요.</div>`;
  return `<label class="fld" style="max-width:320px"><span>회원 선택</span><select id="${id}">${
    S.members.map(m => `<option value="${m.id}"${+sel===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`;
}
function spark(vals, color){
  const v = vals.filter(x => x != null);
  if(v.length < 2) return '<div class="muted" style="font-size:11.5px;padding:6px 0">기록 2개 이상부터 추이가 표시됩니다</div>';
  const mn = Math.min(...v), mx = Math.max(...v), rg = (mx - mn) || 1, W = 240, H = 42;
  const pts = v.map((y,i) => `${(i/(v.length-1)*W).toFixed(1)},${(H - (y-mn)/rg*(H-6) - 3).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${v.map((y,i) => `<circle cx="${(i/(v.length-1)*W).toFixed(1)}" cy="${(H-(y-mn)/rg*(H-6)-3).toFixed(1)}" r="2.4" fill="${color}"/>`).join('')}
  </svg>`;
}
function deltaNum(cur, prev, unit, goodDown){
  if(cur == null) return '<span class="muted" style="font-size:12px">—</span>';
  if(prev == null) return '<span class="muted" style="font-size:12px">첫 기록</span>';
  const d = +(cur - prev).toFixed(1);
  if(!d) return '<span class="muted" style="font-size:12px">변화 없음</span>';
  const good = goodDown ? d < 0 : d > 0;
  return `<span style="color:${good?'var(--good)':'var(--crit)'};font-size:12px;font-weight:700">${d>0?'▲':'▼'} ${Math.abs(d)}${unit}</span>`;
}

function closeModal(){ $('#mask').classList.remove('on'); $('#modal').innerHTML=''; }
function openModal(html){ $('#modal').innerHTML = html; $('#mask').classList.add('on'); }
$('#mask').onclick = e => { if(e.target.id === 'mask') closeModal(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
// 숫자 칸을 누르면 기존 값이 전체 선택돼 바로 새 숫자를 칠 수 있게
document.addEventListener('focusin', e => {
  if(e.target.matches('input.num, input.dec')) setTimeout(() => { try{ e.target.select(); }catch(_){} }, 0);
});
document.addEventListener('input', e => {                 // 숫자 외 문자는 걸러낸다
  if(e.target.matches('input.num')){
    const c = e.target.value.replace(/[^0-9]/g, '');
    if(c !== e.target.value) e.target.value = c;
  } else if(e.target.matches('input.dec')){               // 소수점 1개까지 허용
    let c = e.target.value.replace(/[^0-9.]/g, '');
    const i = c.indexOf('.');
    if(i >= 0) c = c.slice(0, i+1) + c.slice(i+1).replace(/\./g, '');
    if(c !== e.target.value) e.target.value = c;
  }
});
const numOf = (id, def) => {
  const v = parseInt(String(($('#'+id) || {}).value || '').replace(/[^0-9]/g, ''), 10);
  return Number.isFinite(v) ? v : def;
};

  }
  openModal(`<h3>${esc(title)}</h3>
    <label class="fld"><span>회원</span><select id="pm-sel">${memberOptions(null)}</select></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="pm-x">취소</button><button class="btn p" id="pm-ok">다음</button></div>`);
  $('#pm-x').onclick = closeModal;
  $('#pm-ok').onclick = () => { const id = +$('#pm-sel').value; closeModal(); cb(id); };
}

function memberOptions(sel){
  return S.members.map(m => `<option value="${m.id}"${+sel===m.id?' selected':''}>${esc(m.name)} (잔여 ${remain(m.id)})</option>`).join('');
}

/* --- 회원 등록/수정 --- */
function memberModal(id){
  const m = id ? S.members.find(x=>x.id===id) : null;
  openModal(`<h3>${m?'회원 정보 수정':'회원 등록'}</h3>
    <label class="fld"><span>이름 *</span><input id="f-name" value="${esc(m?.name||'')}"></label>
    <div class="row">
      <label class="fld"><span>연락처</span><input id="f-phone" value="${esc(m?.phone||'')}" placeholder="010-0000-0000"></label>
      <label class="fld"><span>담당 트레이너</span><input id="f-tr" value="${esc(m?.trainer||'')}"></label>
    </div>
    <label class="fld"><span>메모</span><textarea id="f-memo" rows="2">${esc(m?.memo||'')}</textarea></label>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      ${m?'<button class="btn d" id="f-del">삭제</button>':''}
      <button class="btn" id="f-cancel">취소</button>
      <button class="btn p" id="f-ok">${m?'저장':'등록'}</button>
    </div>`);
  $('#f-cancel').onclick = closeModal;
  $('#f-ok').onclick = async () => {
    const name = $('#f-name').value.trim();
    if(!name) return toast('이름을 입력하세요');
    const row = { name, phone:$('#f-phone').value.trim(), trainer:$('#f-tr').value.trim(), memo:$('#f-memo').value.trim() };
    const r = m ? await T('crm_members').update(row).eq('id', m.id).select().single()
                : await T('crm_members').insert(row).select().single();
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    if(m) Object.assign(m, r.data); else S.members.push(r.data);
    S.members.sort((a,b)=> a.name.localeCompare(b.name,'ko'));
    closeModal(); render(); toast(m?'저장했습니다':'등록했습니다');
    if(!m) packageModal(r.data.id);
  };
  if(m) $('#f-del').onclick = async () => {
    if(!confirmDo(`${m.name} 회원과 모든 예약·결제 기록을 삭제합니다. 계속할까요?`)) return;
    for(const b of memBks(m.id)) await gDelete(b.gcal_id);
    const r = await T('crm_members').delete().eq('id', m.id);
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    S.members  = S.members.filter(x=>x.id!==m.id);
    S.packages = S.packages.filter(x=>x.member_id!==m.id);
    S.bookings = S.bookings.filter(x=>x.member_id!==m.id);
    closeModal(); render(); toast('삭제했습니다');
  };
}

/* --- 회차 등록(결제) --- */
function packageModal(memberId, back){
  const t = todayStr(), ex = ymd(addDays(new Date(), 180));
  openModal(`<h3>회차 등록 — ${esc(memName(memberId))}</h3>
    <label class="fld"><span>등록 회차 *</span><input id="p-total" class="num" type="text" inputmode="numeric" value="30"></label>
    <div class="presets" id="p-preset">
      <button data-v="10">10회</button><button data-v="20">20회</button><button data-v="30">30회</button>
      <button data-v="50">50회</button><button data-v="100">100회</button>
    </div>
    <label class="fld"><span>결제 금액(원) — 입금액</span><input id="p-price" class="num" type="text" inputmode="numeric" value="0" placeholder="예: 2400000"></label>
    <div class="presets" id="p-money">
      <button data-v="500000">50만</button><button data-v="1000000">100만</button>
      <button data-v="1500000">150만</button><button data-v="2000000">200만</button>
      <button data-v="3000000">300만</button><button data-v="0">0</button>
    </div>
    <div class="row">
      <label class="fld"><span>결제수단</span><select id="p-method"><option>카드</option><option>현금</option><option>계좌이체</option><option>기타</option></select></label>
      <label class="fld"><span>시작일</span><input id="p-start" type="date" value="${t}"></label>
      <label class="fld"><span>만료일</span><input id="p-exp" type="date" value="${ex}"></label>
    </div>
    <label class="fld"><span>메모</span><input id="p-memo" placeholder="예: 재등록 3회차, 이벤트가"></label>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn" id="p-cancel">취소</button><button class="btn p" id="p-ok">등록</button>
    </div>`);
  $$('#p-preset button').forEach(b => b.onclick = () => { $('#p-total').value = b.dataset.v; });
  $$('#p-money button').forEach(b => b.onclick = () => { $('#p-price').value = b.dataset.v; });
  $('#p-cancel').onclick = () => { closeModal(); if(back !== false) detailModal(memberId); };
  $('#p-ok').onclick = async () => {
    const total = numOf('p-total', 0);
    if(total < 1) return toast('회차를 입력하세요');
    const r = await T('crm_packages').insert({
      member_id:memberId, total, price:numOf('p-price', 0), method:$('#p-method').value,
      start_date:$('#p-start').value||null, expire_date:$('#p-exp').value||null, memo:$('#p-memo').value.trim()
    }).select().single();
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    S.packages.push(r.data); closeModal(); render();
    toast(`${memName(memberId)} · ${total}회 / ${won(numOf('p-price',0))}원 등록`, 3000);
    if(back !== false) detailModal(memberId);
  };
}

/* --- 회원 상세 --- */
function detailModal(id){
  const m = S.members.find(x=>x.id===id); if(!m) return;
  const st = memberState(id), ex = expireOf(id), dl = daysLeft(ex);
  const pk = memPkgs(id).slice().sort((a,b) => (b.start_date||'')< (a.start_date||'') ? -1 : (b.start_date||'')>(a.start_date||'') ? 1 : b.id-a.id);
  const bk = memBks(id).slice().sort((a,b)=> +new Date(b.start_at) - +new Date(a.start_at)).slice(0,30);
  const paid = pk.reduce((s,p)=> s + (+p.price||0), 0);

  openModal(`<div class="mhead">
      <div style="flex:1">
        <h3 style="margin:0">${esc(m.name)}</h3>
        <div class="muted" style="font-size:13px">${esc(m.phone||'연락처 없음')}${m.trainer?' · '+esc(m.trainer):''}</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px">등록일 ${startOf(id)||'—'} · 만료일 ${ex||'—'}${firstJoin(id)&&firstJoin(id)!==startOf(id)?` · 최초등록 ${firstJoin(id)}`:''}</div>
      </div>
      <span class="tag ${st.k}">${st.t}</span>
    </div>

    <div class="row" style="gap:8px;margin-bottom:14px">
      <div class="card" style="flex:1;min-width:88px;padding:11px"><div class="muted" style="font-size:11px">잔여</div>
        <div style="font-size:24px;font-weight:800;color:var(--${st.k==='ok'?'good':st.k==='warn'?'warn':'crit'})">${remain(id)}<span style="font-size:13px;color:var(--ink-3)">회</span></div></div>
      <div class="card" style="flex:1;min-width:88px;padding:11px"><div class="muted" style="font-size:11px">사용 / 등록</div>
        <div style="font-size:24px;font-weight:800">${usedCount(id)}<span style="font-size:13px;color:var(--ink-3)">/${totalCount(id)}</span></div></div>
      <div class="card" style="flex:1;min-width:88px;padding:11px"><div class="muted" style="font-size:11px">만료일</div>
        <div style="font-size:15px;font-weight:700;padding-top:6px">${ex||'—'}${dl!==null?`<br><span class="muted" style="font-size:11px">D${dl>=0?'-'+dl:'+'+(-dl)}</span>`:''}</div></div>
    </div>

    ${m.memo?`<div class="card" style="padding:10px 12px;margin-bottom:12px;font-size:13px">📝 ${esc(m.memo)}</div>`:''}

    <div class="row" style="margin-bottom:14px">
      <button class="btn p" id="d-book">+ 예약 잡기</button>
      <button class="btn g" id="d-pkg">+ 회차 등록</button>
      <button class="btn" id="d-edit">정보 수정</button>
    </div>

    <h2 style="font-size:13px">💳 결제 · 등록 이력 (누적 ${won(paid)}원)</h2>

    <div class="card" style="padding:10px 11px;margin-bottom:9px;background:var(--bg-2)">
      <div style="display:grid;grid-template-columns:76px 1fr 100px;gap:8px">
        <label class="fld" style="margin:0"><span>회차</span>
          <input id="q-total" class="num" type="text" inputmode="numeric" value="10" style="padding:7px 9px"></label>
        <label class="fld" style="margin:0"><span>입금액(원)</span>
          <input id="q-price" class="num" type="text" inputmode="numeric" placeholder="0" style="padding:7px 9px"></label>
        <label class="fld" style="margin:0"><span>수단</span>
          <select id="q-method" style="padding:7px 9px"><option>카드</option><option>현금</option><option>계좌이체</option><option>기타</option></select></label>
      </div>
      <button class="btn p" id="q-add" style="width:100%;margin-top:9px">+ 결제 추가</button>
      <div class="muted" style="font-size:11px;margin-top:7px;line-height:1.45">
        오늘 날짜 · 만료 6개월로 등록됩니다. 날짜까지 정하려면 위 <b>+ 회차 등록</b>을 쓰세요.</div>
    </div>

    <div class="pkglist">${
      pk.length ? pk.map(p=>`<div class="pkgrow">
        <div class="a">
          <input class="num inl" data-ptotal="${p.id}" value="${p.total}"><em>회</em>
          <span class="sp"></span>
          <input class="num inl amt" data-pprice="${p.id}" value="${p.price||0}"><em>원</em>
          <span class="tag">${esc(p.method||'-')}</span>
          <button class="btn sm d" data-delpkg="${p.id}">✕</button>
        </div>
        <div class="b">${p.start_date||'—'} ~ ${p.expire_date||'—'}${p.memo?` · ${esc(p.memo)}`:''}</div>
      </div>`).join('')
        : '<div class="muted" style="padding:12px;font-size:13px">등록 이력이 없습니다. 위에서 바로 추가하세요.</div>'}</div>

    <h2 style="font-size:13px">📋 출결 이력</h2>
    <div class="hist">${
      bk.length ? bk.map(b=>{ const s=new Date(b.start_at);
        const col = b.status==='완료'?'ok':b.status==='노쇼'?'crit':'';
        return `<div><span>${ymd(s)} (${DOW[s.getDay()]}) ${hm(s)}</span><span style="flex:1"></span>
          <span class="tag ${col}">${b.status}</span>
          <button class="btn sm" data-openbk="${b.id}">보기</button></div>`; }).join('')
        : '<div class="muted">예약 이력이 없습니다.</div>'}</div>

    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="d-close">닫기</button></div>`);

  $('#d-close').onclick = closeModal;
  $('#d-edit').onclick  = () => { closeModal(); memberModal(id); };
  $('#d-pkg').onclick   = () => { closeModal(); packageModal(id); };
  $('#d-book').onclick  = () => { closeModal(); bookingModal(null, todayStr(), '10:00', id); };
  $$('[data-openbk]').forEach(el => el.onclick = () => { closeModal(); bookingModal(+el.dataset.openbk); });
  // 빠른 결제 추가
  $('#q-add').onclick = async () => {
    const total = numOf('q-total', 0), price = numOf('q-price', 0);
    if(total < 1) return toast('회차를 입력하세요');
    const r = await T('crm_packages').insert({
      member_id:id, total, price, method:$('#q-method').value,
      start_date:todayStr(), expire_date:ymd(addDays(new Date(), 180)), memo:''
    }).select().single();
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    S.packages.push(r.data); render(); detailModal(id);
    toast(`${total}회 / ${won(price)}원 추가 · 잔여 ${remain(id)}회`, 3000);
  };

  // 기존 이력 금액·회차 직접 수정 (칸에서 나가면 저장)
  const inlSave = async (el, field) => {
    const pid = +el.dataset[field === 'price' ? 'pprice' : 'ptotal'];
    const pg = S.packages.find(x => x.id === pid); if(!pg) return;
    const v = parseInt(String(el.value).replace(/[^0-9]/g,''), 10);
    if(!Number.isFinite(v) || v === (+pg[field]||0)) { el.value = pg[field]||0; return; }
    if(field === 'total' && v < 1) { el.value = pg.total; return toast('회차는 1 이상이어야 합니다'); }
    const r = await T('crm_packages').update({ [field]: v }).eq('id', pid).select().single();
    if(r.error){ el.value = pg[field]||0; return toast('오류: ' + r.error.message, 3600); }
    Object.assign(pg, r.data); render(); detailModal(id);
    toast(field === 'price' ? `금액 ${won(v)}원으로 수정` : `${v}회로 수정 · 잔여 ${remain(id)}회`, 2600);
  };
  $$('[data-pprice]').forEach(el => {
    el.onchange = () => inlSave(el, 'price');
    el.onkeydown = e => { if(e.key === 'Enter') el.blur(); };
  });
  $$('[data-ptotal]').forEach(el => {
    el.onchange = () => inlSave(el, 'total');
    el.onkeydown = e => { if(e.key === 'Enter') el.blur(); };
  });

  $$('[data-delpkg]').forEach(el => el.onclick = async () => {
    if(!confirmDo('이 등록 이력을 삭제할까요? 잔여 회차가 줄어듭니다.')) return;
    const r = await T('crm_packages').delete().eq('id', +el.dataset.delpkg);
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    S.packages = S.packages.filter(x => x.id !== +el.dataset.delpkg);
    render(); detailModal(id);
  });
}

/* --- 예약 생성 / 상세 --- */
function bookingModal(bkId, dateStr, timeStr, presetMember){
  const c = cfg();
  const b = bkId ? S.bookings.find(x=>x.id===bkId) : null;
  const s = b ? new Date(b.start_at) : mkDate(dateStr, timeStr);
  const dur = b ? Math.round((new Date(b.end_at) - s)/60000) : +c.dur;
  const mid = b ? b.member_id : (presetMember || (S.members[0] && S.members[0].id));

  if(!S.members.length){
    openModal(`<h3>회원이 없습니다</h3><p class="muted">예약을 잡으려면 회원을 먼저 등록하세요.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="b-cancel">닫기</button>
      <button class="btn p" id="b-new">회원 등록</button></div>`);
    $('#b-cancel').onclick = closeModal;
    $('#b-new').onclick = () => { closeModal(); memberModal(null); };
    return;
  }

  const rem = mid ? remain(mid) : 0;
  openModal(`<h3>${b?'예약 상세':'예약 잡기'}</h3>
    ${b && rem<=0 ? '<div class="unm" style="border-color:var(--crit);background:rgba(239,91,91,.1)">⚠ 잔여 회차가 없습니다. 재등록이 필요합니다.</div>' : ''}
    <label class="fld"><span>회원 *</span><select id="b-mem">${memberOptions(mid)}</select></label>
    <div class="row">
      <label class="fld"><span>날짜</span><input id="b-date" type="date" value="${ymd(s)}"></label>
      <label class="fld"><span>시작</span><input id="b-time" type="time" step="300" value="${hm(s)}"></label>
      <label class="fld"><span>시간(분)</span><input id="b-dur" class="num" type="text" inputmode="numeric" value="${dur}"></label>
    </div>
    <label class="fld"><span>메모</span><input id="b-memo" value="${esc(b?.memo||'')}"></label>
    ${b?`<div class="row" style="margin:4px 0 12px">
      <button class="btn ${b.status==='완료'?'g':''}" id="b-done">✅ 출석 완료${b.status==='완료'?' (적용됨)':''}</button>
      <button class="btn ${b.status==='노쇼'?'w':''}" id="b-no">🚫 노쇼</button>
      <button class="btn" id="b-reset">↩ 예약 상태로</button>
    </div>
    <p class="muted" style="font-size:12px;margin:0 0 12px">출석 완료로 바꾸면 잔여 회차가 1회 차감됩니다${cfg().noshow?' (노쇼도 차감 설정됨)':' (노쇼는 차감되지 않음)'}.</p>`:''}
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      ${b?'<button class="btn d" id="b-del">삭제</button>':''}
      <button class="btn" id="b-cancel">닫기</button>
      <button class="btn p" id="b-ok">${b?'저장':'예약'}</button>
    </div>`);

  $('#b-cancel').onclick = closeModal;
  $('#b-ok').onclick = async () => {
    const memId = +$('#b-mem').value;
    const st = mkDate($('#b-date').value, $('#b-time').value);
    const en = new Date(+st + numOf('b-dur', +cfg().dur)*60000);
    if(isNaN(+st)) return toast('날짜/시간을 확인하세요');
    if(!b && remain(memId) <= 0 && !confirmDo(`${memName(memId)} 회원은 잔여 회차가 없습니다. 그래도 예약할까요?`)) return;
    const row = { member_id:memId, start_at:st.toISOString(), end_at:en.toISOString(), memo:$('#b-memo').value.trim() };
    const r = b ? await T('crm_bookings').update(row).eq('id', b.id).select().single()
                : await T('crm_bookings').insert(Object.assign({status:'예약'}, row)).select().single();
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    if(b) Object.assign(b, r.data); else S.bookings.push(r.data);
    closeModal(); render();
    await gPush(b || r.data);
    render(); toast(b?'저장했습니다':'예약했습니다');
  };
  if(b){
    const setStatus = async st => {
      const r = await T('crm_bookings').update({status:st}).eq('id', b.id).select().single();
      if(r.error) return toast('오류: ' + r.error.message, 3600);
      Object.assign(b, r.data); closeModal(); render(); await gPush(b);
      const d = st==='완료' || (cfg().noshow && st==='노쇼');
      toast(`${memName(b.member_id)} · ${st}${d?` → 잔여 ${remain(b.member_id)}회`:' (차감 없음)'}`, 3000);
    };
    $('#b-done').onclick  = () => setStatus('완료');
    $('#b-no').onclick    = () => setStatus('노쇼');
    $('#b-reset').onclick = () => setStatus('예약');
    $('#b-del').onclick   = async () => {
      if(!confirmDo('이 예약을 삭제할까요? 구글 캘린더에서도 사라집니다.')) return;
      const gid = b.gcal_id;
      const r = await T('crm_bookings').delete().eq('id', b.id);
      if(r.error) return toast('오류: ' + r.error.message, 3600);
      S.bookings = S.bookings.filter(x=>x.id!==b.id);
      closeModal(); render(); await gDelete(gid); toast('삭제했습니다');
    };
  }
}

/* --- 미연결 캘린더 일정 → 회원 연결 --- */
function linkModal(gid){
  const u = S.unmatched.find(x=>x.id===gid); if(!u) return;
  if(!S.members.length){ toast('먼저 회원을 등록하세요'); return; }
  openModal(`<h3>일정을 회원과 연결</h3>
    <div class="card" style="padding:11px;margin-bottom:13px">
      <b>${esc(u.summary)}</b><div class="muted" style="font-size:13px">${ymd(u.s)} ${hm(u.s)} – ${hm(u.e)}</div></div>
    <label class="fld"><span>회원 선택</span><select id="l-mem">${memberOptions(null)}</select></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="l-cancel">취소</button><button class="btn p" id="l-ok">연결</button></div>`);
  $('#l-cancel').onclick = closeModal;
  $('#l-ok').onclick = async () => {
    const mid = +$('#l-mem').value;
    const r = await T('crm_bookings').insert({
      member_id:mid, start_at:u.s.toISOString(), end_at:u.e.toISOString(),
      status:'예약', gcal_id:u.id, memo:'구글 캘린더에서 연결'
    }).select().single();
    if(r.error) return toast('오류: ' + r.error.message, 3600);
    S.bookings.push(r.data);
    S.unmatched = S.unmatched.filter(x=>x.id!==gid);
    await gapi(calPath()+'/'+encodeURIComponent(gid), { method:'PATCH',
      body: JSON.stringify({ extendedProperties:{ private:{ ptcrm_booking:String(r.data.id), ptcrm_member:String(mid) } } })
    }).catch(()=>{});
    closeModal(); render(); toast(`${memName(mid)} 예약으로 연결했습니다`);
  };
}

/* ============================================================
   라우팅 · 부팅
   ============================================================ */
const VIEWS = { cal:'예약', mem:'회원', rev:'매출', re:'재등록 대상', body:'체형관리', work:'운동이력', note:'특이사항', set:'설정' };
function render(){
  $$('#side nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + S.view));
  const t = $('#mtitle'); if(t) t.textContent = VIEWS[S.view] || '';
  ({ cal:renderCal, mem:renderMem, rev:renderRev, re:renderRe,
     body:renderBody, work:renderWork, note:renderNote, set:renderSet }[S.view] || (()=>{}))();
  const n = reTargets().length, bd = $('#re-badge');
  if(bd){ bd.textContent = n; bd.style.display = n ? '' : 'none'; }
  paintSync();
}
function go(v){ S.view = v; closeSide(); render(); }
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }
$$('#side nav button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#btn-sync').onclick  = () => syncWindow(true);
$('#btn-sync2').onclick = () => syncWindow(true);
$('#burger').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('on'); };
$('#scrim').onclick  = closeSide;

function gateHTML(msg){
  const c = cfg();
  if(preset()) return `<div class="card" style="text-align:center;padding:30px 22px">
    <div style="font-size:44px;line-height:1;margin-bottom:10px">📅</div>
    <h2 style="font-size:19px;margin-bottom:6px">PT 고객관리</h2>
    <p class="muted" style="margin:0 0 20px;font-size:13.5px">구글 계정으로 로그인하면 시작됩니다.<br>캘린더 권한을 허용해 주세요.</p>
    ${msg?`<div class="unm" style="text-align:left">${msg}</div>`:''}
    <button class="btn p" id="g-login" style="width:100%;padding:12px">구글 계정으로 로그인</button>
    <p class="muted" style="font-size:11.5px;margin:18px 0 0">문제가 있으면 관리자에게 문의하세요.</p>
    <button class="btn sm" id="g-manual" style="margin-top:10px;opacity:.45">수동 설정</button>
  </div>`;
  return setupHTML(msg);
}
function setupHTML(msg){
  const c = cfg();
  return `<div class="card">
    <h2>PT 고객관리 — 최초 설정</h2>
    ${msg?`<div class="unm">${msg}</div>`:''}
    <div class="step"><b>1</b><div>Supabase에서 <code>schema.sql</code>을 실행한 뒤, Project URL과 anon key를 붙여넣으세요.</div></div>
    <label class="fld"><span>Supabase Project URL</span><input id="g-url" value="${esc(c.sb_url)}" placeholder="https://xxxx.supabase.co"></label>
    <label class="fld"><span>Supabase anon key</span><input id="g-key" value="${esc(c.sb_key)}" placeholder="eyJhbGciOi..."></label>
    <div class="step"><b>2</b><div>Google Cloud에서 만든 OAuth 클라이언트 ID를 붙여넣으세요. (캘린더 연동용)</div></div>
    <label class="fld"><span>Google OAuth 클라이언트 ID</span><input id="g-cid" value="${esc(c.gcid)}" placeholder="....apps.googleusercontent.com"></label>
    <button class="btn p" id="g-save">저장하고 계속</button>
    <hr><div class="step"><b>3</b><div>구글 계정으로 로그인하면 시작됩니다.</div></div>
    <button class="btn p" id="g-login" ${(!c.sb_url||!c.sb_key)?'disabled style="opacity:.4"':''}>구글 계정으로 로그인</button>
  </div>`;
}
function showGate(msg){
  $('#app').style.display = 'none';
  const g = $('#gate'); g.style.display = 'block'; g.innerHTML = gateHTML(msg);
  const mb = $('#g-manual');
  if(mb) mb.onclick = () => { g.innerHTML = setupHTML(msg); bindGate(g); };
  bindGate(g);
}
function bindGate(g){
  if($('#g-save')) $('#g-save').onclick = () => {
    setCfg({ sb_url:$('#g-url').value.trim().replace(/\/+$/,''), sb_key:$('#g-key').value.trim(), gcid:$('#g-cid').value.trim() });
    location.reload();
  };
  const lb = $('#g-login');
  if(lb) lb.onclick = async () => {
    if(!sb && !initSB()) return toast('Supabase 정보를 먼저 저장하세요');
    const { error } = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{ scopes:GSCOPE, redirectTo:location.href.split('#')[0].split('?')[0],
                queryParams:{ access_type:'offline', prompt:'consent' } }
    });
    if(error) toast('로그인 실패: ' + error.message, 4000);
  };
}

async function boot(){
  if(!initSB()) return showGate('');
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return showGate('');
  S.user = session.user;
  if(session.provider_token) GTOK = { t:session.provider_token, exp: Date.now() + 50*60*1000 };

  $('#gate').style.display = 'none';
  $('#app').style.display  = 'flex';
  $('#who-mail').textContent = (S.user && S.user.email) || '';
  S.mode = window.innerWidth < 860 ? 'day' : 'week';
  S.anchor = anchorFor(S.mode);

  try{ await loadAll(); }
  catch(e){ return showGate('데이터를 읽지 못했습니다: ' + esc(e.message) + '<br>schema.sql 실행 여부와 키를 확인하세요.'); }

  render();
  setTimeout(() => syncWindow(false), 700);
  setInterval(() => { if(!document.hidden && S.view==='cal') syncWindow(false); }, 180000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) syncWindow(false); });
}
boot();
</script>
